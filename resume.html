<!-- Loading Popup -->
<div id="loadingPopup" class="loading-overlay">
    <div class="loading-content">
        <div class="loader"></div>
        <h2>Loading Resume</h2>
        <p>Please wait while the document loads...</p>
    </div>
</div>

<script>
    const loadingStart = Date.now();
    let popupHidden = false;

    function hideResumeLoader() {
        if (popupHidden) return;

        popupHidden = true;

        const elapsed = Date.now() - loadingStart;
        const remaining = Math.max(0, 800 - elapsed);

        setTimeout(() => {
            document.getElementById("loadingPopup")
                .classList.add("hidden");
        }, remaining);
    }

    // Fallback after 20 seconds
    setTimeout(hideResumeLoader, 20000);
</script>

    <script>
document.addEventListener("DOMContentLoaded", function () {

    const resumeFrame = document.getElementById("resumeFrame");
    const loadingPopup = document.getElementById("loadingPopup");

    // Keep popup visible briefly to prevent flashing
    const minimumLoadingTime = 800;
    const startTime = Date.now();

    function hideLoadingPopup() {

        const elapsedTime = Date.now() - startTime;
        const remainingTime = Math.max(
            0,
            minimumLoadingTime - elapsedTime
        );

        setTimeout(function () {
            loadingPopup.classList.add("hidden");
        }, remainingTime);
    }

    // Hide popup when Microsoft document iframe loads
    resumeFrame.addEventListener("load", hideLoadingPopup);

    // Fallback in case Microsoft takes too long
    setTimeout(function () {
        loadingPopup.classList.add("hidden");
    }, 20000);

});
</script>
